<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>POLYHEDRAL CATHEDRAL</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Playfair+Display:ital@1&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --canvas:   #f5f0e8;
  --ink:      #1a1612;
  --ink2:     #3a3028;
  --dust:     #d8cfc0;
  --dust2:    #c4b89a;
  --accent1:  #c0392b; /* vermillion */
  --accent2:  #1a5276; /* prussian blue */
  --accent3:  #117a40; /* viridian */
  --accent4:  #8e5c1a; /* raw sienna */
  --accent5:  #5b2c6f; /* violet */
  --accent6:  #1a6666; /* teal */
  --accent7:  #b7770d; /* ochre */
  --accent8:  #2e4057; /* slate */
  --void:     #1a1612;
  --mono: 'DM Mono', monospace;
  --serif: 'Playfair Display', serif;
}

html, body {
  width: 100%; min-height: 100dvh;
  background: var(--ink);
  display: flex; align-items: flex-start; justify-content: center;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}

/* ─── ENTRY SCREEN ─────────────────────────────────────────── */
#entry {
  position: fixed; inset: 0; z-index: 9999;
  background: var(--ink);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 32px;
  cursor: pointer;
}

#entry-svg { width: 120px; height: 120px; animation: entry-spin 12s linear infinite; }
@keyframes entry-spin { to { transform: rotate(360deg); } }

.entry-word {
  font-family: var(--mono);
  font-size: 18px;
  color: var(--canvas);
  letter-spacing: 8px;
  text-transform: uppercase;
  text-align: center;
  opacity: 0;
  animation: entry-fade 2s ease forwards 0.4s;
}
@keyframes entry-fade { to { opacity: 1; } }

.entry-sub {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 300;
  color: var(--dust2);
  letter-spacing: 4px;
  text-transform: uppercase;
  opacity: 0;
  animation: entry-fade 2s ease forwards 1.2s;
}

#entry.leaving {
  animation: entry-out 0.6s ease forwards;
}
@keyframes entry-out {
  to { opacity: 0; transform: scale(1.04); pointer-events: none; }
}

/* ─── MAIN APP ──────────────────────────────────────────────── */
#app {
  width: 100%; max-width: 430px;
  background: var(--canvas);
  height: 100dvh;
  overflow-y: auto;
  overflow-x: hidden;
  display: flex; flex-direction: column;
  padding: clamp(8px,2vw,16px) clamp(8px,3vw,16px) clamp(8px,2vw,16px);
  gap: 0;
  opacity: 0;
  transition: opacity 0.8s ease 0.3s;
}
#app.visible { opacity: 1; }

/* ─── HEADER ────────────────────────────────────────────────── */
.hdr {
  display: flex; align-items: baseline;
  justify-content: space-between;
  margin-bottom: clamp(8px,2vw,16px);
  padding-bottom: 8px;
  border-bottom: 1px solid var(--dust2);
}

.hdr-title {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(18px,5vw,26px);
  color: var(--ink);
  letter-spacing: 1px;
  line-height: 1;
}

.hdr-right {
  display: flex; align-items: center; gap: 14px;
}

.ctrl-pair {
  display: flex; align-items: center; gap: 6px;
}
.ctrl-lbl {
  font-family: var(--mono);
  font-size: 8px;
  font-weight: 300;
  color: var(--dust2);
  letter-spacing: 3px;
  text-transform: uppercase;
}
.ctrl-val {
  font-family: var(--mono);
  font-size: 16px;
  font-weight: 400;
  color: var(--ink);
  min-width: 34px;
  text-align: center;
}
.arr-btn {
  background: none; border: none; cursor: pointer;
  font-family: var(--mono); font-size: 14px;
  color: var(--ink2); padding: 4px;
  line-height: 1;
  transition: color 0.1s;
  -webkit-tap-highlight-color: transparent;
}
.arr-btn:active { color: var(--accent1); }

/* ─── SHAPE PALETTE ─────────────────────────────────────────── */
.palette-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: clamp(4px,1.5vw,10px);
  margin-bottom: clamp(6px,1.5vw,12px);
}

.shape-cell {
  aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.shape-cell.gone { opacity: 0; pointer-events: none; transition: opacity 0.3s; }

.shape-svg-wrap {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  position: relative;
}

.shape-svg-wrap svg {
  overflow: visible;
  width: 76%;
  height: 76%;
  transition: transform 0.15s;
}
.shape-cell:active .shape-svg-wrap svg { transform: scale(0.88); }

/* ─── DIVIDER LINE ──────────────────────────────────────────── */
.divider {
  width: 100%;
  height: 1px;
  background: var(--dust2);
  margin-bottom: 8px;
  position: relative;
}
.divider::after {
  content: attr(data-label);
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  background: var(--canvas);
  padding: 0 8px;
  font-family: var(--mono);
  font-size: 8px;
  font-weight: 300;
  color: var(--dust2);
  letter-spacing: 3px;
  text-transform: uppercase;
  white-space: nowrap;
}

/* ─── TRANSPORT ─────────────────────────────────────────────── */
.transport {
  display: flex; align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.play-ring {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1.5px solid var(--ink);
  background: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
  flex-shrink: 0;
}
.play-ring:active { background: var(--ink); }
.play-ring.playing {
  background: var(--ink);
  animation: ring-pulse 1.2s ease-in-out infinite alternate;
}
@keyframes ring-pulse {
  from { box-shadow: none; }
  to   { box-shadow: 0 0 0 4px var(--dust2); }
}
.play-ring svg { width: 16px; height: 16px; }
.play-ring.playing svg { fill: var(--canvas); }

.steps-ctrl { display: flex; align-items: center; gap: 4px; }

/* ─── SEQUENCER GRID ────────────────────────────────────────── */
.seq-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 3px;
  margin-bottom: 3px;
}
.seq-grid + .seq-grid { margin-bottom: 8px; }

.seq-sq {
  aspect-ratio: 1;
  border: 1px solid var(--dust);
  background: transparent;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  position: relative;
  transition: border-color 0.15s, background 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.seq-sq.inactive {
  border-color: transparent;
  background: repeating-linear-gradient(
    -45deg, transparent, transparent 3px,
    var(--dust) 3px, var(--dust) 3.5px
  );
  opacity: 0.35;
  cursor: default;
  pointer-events: none;
}
.seq-sq.drop-hover {
  border-color: var(--ink);
  background: rgba(26,22,18,0.05);
}
.seq-sq.beat-flash {
  background: rgba(26,22,18,0.08);
}
.seq-sq svg { width: 72%; height: 72%; overflow: visible; }

/* FX row below sequencer */
.fx-row {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 3px;
  margin-bottom: 6px;
}
.fx-dot-wrap {
  display: flex; align-items: center; justify-content: center;
}
.fx-dot {
  width: 100%;
  min-height: 32px;
  border: none; background: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  padding: 8px 4px;
  -webkit-tap-highlight-color: transparent;
  position: relative;
}
.fx-dot-inner {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--dust);
  transition: all 0.15s;
  flex-shrink: 0;
}
.fx-dot.has-fx .fx-dot-inner {
  background: var(--ink);
  box-shadow: 0 0 0 2px var(--dust2);
}
.fx-dot.inactive-fx { opacity: 0.2; pointer-events: none; }

.fx-dot-label {
  font-family: var(--mono);
  font-size: 6px;
  font-weight: 400;
  letter-spacing: 0.5px;
  color: var(--canvas);
  background: var(--ink);
  padding: 1px 3px;
  border-radius: 1px;
  position: absolute;
  bottom: 2px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  pointer-events: none;
}

/* FX label that appears on tap */
.fx-label-pop {
  position: fixed;
  background: var(--ink);
  color: var(--canvas);
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 2px;
  padding: 5px 10px;
  pointer-events: none;
  z-index: 8888;
  transform: translate(-50%, -140%);
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.15s;
}
.fx-label-pop.show { opacity: 1; }

/* ─── VOID ZONE ─────────────────────────────────────────────── */
.void-zone {
  display: flex; align-items: center; justify-content: center;
  gap: 16px;
  padding: 12px 0 4px;
  border-top: 1px solid var(--dust2);
}
.void-ring {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1.5px solid var(--dust2);
  background: none;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}
.void-ring::after {
  content: '';
  position: absolute; inset: 6px;
  border-radius: 50%;
  border: 1px solid var(--dust2);
  animation: void-spin 8s linear infinite;
  opacity: 0.5;
}
@keyframes void-spin { to { transform: rotate(360deg); border-radius: 40% 60% 55% 45%; } }
.void-ring.over {
  border-color: var(--ink);
  background: var(--ink);
}
.void-ring.over::after { border-color: var(--canvas); }
.void-lbl {
  font-family: var(--mono);
  font-size: 8px;
  font-weight: 300;
  letter-spacing: 4px;
  color: var(--dust2);
  text-transform: uppercase;
}

/* ─── DRAG GHOST ────────────────────────────────────────────── */
#ghost {
  position: fixed;
  pointer-events: none;
  z-index: 9990;
  transform: translate(-50%, -50%) scale(1.15);
  display: none;
  opacity: 0.85;
  width: 60px; height: 60px;
}
#ghost svg { width: 100%; height: 100%; overflow: visible; }

/* ─── SHAPE ANIMATIONS ──────────────────────────────────────── */
.shape-anim-spin  { animation: shape-spin  var(--spd,8s)  linear   infinite; }
.shape-anim-pulse { animation: shape-pulse var(--spd,3s)  ease-in-out infinite alternate; }
.shape-anim-drift { animation: shape-drift var(--spd,5s)  ease-in-out infinite alternate; }
.shape-anim-rock  { animation: shape-rock  var(--spd,4s)  ease-in-out infinite alternate; }

@keyframes shape-spin  { to   { transform: rotate(360deg); } }
@keyframes shape-pulse { from { transform: scale(0.88); } to { transform: scale(1.08); } }
@keyframes shape-drift { from { transform: translateY(-4px) rotate(-6deg); } to { transform: translateY(4px) rotate(6deg); } }
@keyframes shape-rock  { from { transform: rotate(-12deg); } to { transform: rotate(12deg); } }

.playing-burst { animation: burst 0.22s ease-out; }
@keyframes burst {
  0%   { transform: scale(1.4); opacity: 0.6; }
  100% { transform: scale(1);   opacity: 1; }
}

/* Shuffle button */
.shuffle-btn {
  background: none; border: 1.5px solid var(--dust2); border-radius: 20px;
  color: var(--ink2); font-family: var(--mono); font-size: 9px;
  letter-spacing: 2px; text-transform: uppercase;
  padding: 5px 11px; cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
  white-space: nowrap;
}
.shuffle-btn:active { background: var(--ink); color: var(--canvas); border-color: var(--ink); }
.shuffle-btn.flash { background: var(--ink); color: var(--canvas); border-color: var(--ink); }

/* Jitter when a cell fires */
.shape-jitter {
  animation: jitter 0.28s ease-out !important;
  animation-iteration-count: 1 !important;
}
@keyframes jitter {
  0%   { transform: scale(1.35) rotate(0deg); }
  25%  { transform: scale(1.2)  rotate(-8deg); }
  50%  { transform: scale(1.28) rotate(6deg); }
  75%  { transform: scale(1.15) rotate(-4deg); }
  100% { transform: scale(1)    rotate(0deg); }
}

/* Cell glow on beat */
.seq-sq.beat-flash { background: rgba(26,22,18,0.06); }
.seq-sq.seq-playing {
  background: rgba(26,22,18,0.1);
  border-color: var(--ink) !important;
}

</style>
</head>
<body>

<!-- ── ENTRY SCREEN ──────────────────────────────────────────── -->
<div id="entry" role="button" aria-label="Touch to begin">
  <svg id="entry-svg" viewBox="-60 -60 120 120" xmlns="http://www.w3.org/2000/svg">
    <polygon points="0,-50 43.3,25 -43.3,25"  fill="#c0392b" fill-opacity="0.25" stroke="#c0392b" stroke-width="1.5"/>
    <rect x="-33" y="-33" width="66" height="66" fill="#1a5276" fill-opacity="0.2" stroke="#1a5276" stroke-width="1.5" transform="rotate(22)"/>
    <circle cx="0" cy="0" r="24" fill="#f5f0e8" fill-opacity="0.12" stroke="#f5f0e8" stroke-width="1"/>
  </svg>
  <div class="entry-word">POLYHEDRAL CATHEDRAL</div>
  <div class="entry-sub">touch to begin</div>
</div>

<!-- ── MAIN APP ──────────────────────────────────────────────── -->
<div id="app">

  <!-- header -->
  <div class="hdr">
    <div class="hdr-title">Polyhedral Cathedral</div>
    <div class="hdr-right">
      <button class="shuffle-btn" id="shuffleBtn">shuffle</button>
      <div class="ctrl-pair">
        <button class="arr-btn" id="bpmDn">‹</button>
        <div>
          <div class="ctrl-lbl">bpm</div>
          <div class="ctrl-val" id="bpmVal">120</div>
        </div>
        <button class="arr-btn" id="bpmUp">›</button>
      </div>
    </div>
  </div>

  <!-- shape palette -->
  <div class="palette-row" id="palette"></div>
  <div class="palette-row" id="palette2"></div>

  <div class="divider" data-label="sequence" style="margin-bottom:12px;"></div>

  <!-- transport -->
  <div class="transport">
    <button class="play-ring" id="playBtn" aria-label="Play / Stop">
      <svg viewBox="0 0 16 16" fill="var(--ink)" xmlns="http://www.w3.org/2000/svg" id="playIcon">
        <polygon points="4,2 14,8 4,14"/>
      </svg>
    </button>
    <div class="steps-ctrl">
      <button class="arr-btn" id="stepsDn">‹</button>
      <div>
        <div class="ctrl-lbl" style="text-align:center;">steps</div>
        <div class="ctrl-val" id="stepsVal">8</div>
      </div>
      <button class="arr-btn" id="stepsUp">›</button>
    </div>
  </div>

  <!-- sequencer row A -->
  <div class="seq-grid" id="seqA"></div>
  <!-- fx row A -->
  <div class="fx-row" id="fxA"></div>

  <!-- sequencer row B -->
  <div class="seq-grid" id="seqB"></div>
  <!-- fx row B -->
  <div class="fx-row" id="fxB"></div>

  <!-- void -->
  <div class="void-zone">
    <div class="void-lbl">dissolve</div>
    <div class="void-ring" id="voidRing">
      <svg viewBox="0 0 20 20" width="12" height="12">
        <circle cx="10" cy="10" r="6" fill="none" stroke="var(--dust2)" stroke-width="1.5"/>
        <circle cx="10" cy="10" r="2" fill="var(--dust2)"/>
      </svg>
    </div>
    <div class="void-lbl">here</div>
  </div>

</div>

<!-- drag ghost -->
<div id="ghost"></div>
<!-- fx label popup -->
<div class="fx-label-pop" id="fxPop"></div>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════
   AUDIO — initialised only after user gesture
═══════════════════════════════════════════════════════════════ */
let AC = null, masterOut = null, noiseBuf = null;

function initAudio() {
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  const comp = AC.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 4;
  comp.attack.value = 0.003; comp.release.value = 0.12;
  const gain = AC.createGain(); gain.gain.value = 0.72;
  comp.connect(gain); gain.connect(AC.destination);
  masterOut = comp;
  noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
}
function resumeAC() {
  if (AC && AC.state === 'suspended') { try { AC.resume(); } catch(e){} }
}

/* ── scale helpers ─────────────────────────────────────────── */
const SC = {
  minor:  [0,2,3,5,7,8,10],
  major:  [0,2,4,5,7,9,11],
  blues:  [0,3,5,6,7,10],
  dorian: [0,2,3,5,7,9,10],
  penta:  [0,3,5,7,10],
};
const SC_KEYS = Object.keys(SC);
function m2f(midi) { return 440 * Math.pow(2,(midi-69)/12); }
function scaleTone(root, sc, deg) {
  const s = SC[sc]||SC.minor;
  const f = m2f(root + s[((deg%s.length)+s.length)%s.length] + Math.floor(deg/s.length)*12);
  return Math.max(f, 20); // never below 20Hz — iOS WebAudio minimum
}

/* ── audio primitives ──────────────────────────────────────── */
function noise(when, dur, ftype, ffreq, fq, vol, out) {
  if (!AC) return;
  out = out||masterOut;
  const s=AC.createBufferSource(); s.buffer=noiseBuf;
  const f=AC.createBiquadFilter(); f.type=ftype; f.frequency.value=ffreq; f.Q.value=fq||1;
  const g=AC.createGain();
  g.gain.setValueAtTime(vol,when); g.gain.exponentialRampToValueAtTime(0.001,when+dur);
  s.connect(f); f.connect(g); g.connect(out); s.start(when); s.stop(when+dur+0.05);
}
function osc(type, freq, when, dur, vol, envA, filtF, filtQ, out) {
  if (!AC) return;
  out = out||masterOut;
  const o=AC.createOscillator(); o.type=type; o.frequency.value=freq;
  const g=AC.createGain();
  g.gain.setValueAtTime(0.0001,when); g.gain.linearRampToValueAtTime(vol,when+(envA||0.004));
  g.gain.exponentialRampToValueAtTime(0.001,when+dur);
  if (filtF) {
    const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=filtF; f.Q.value=filtQ||1;
    o.connect(f); f.connect(g);
  } else { o.connect(g); }
  g.connect(out); o.start(when); o.stop(when+dur+0.05);
}
function oscSweep(type, f0, f1, when, dur, vol, out) {
  if (!AC) return;
  out = out||masterOut;
  const o=AC.createOscillator(); o.type=type;
  o.frequency.setValueAtTime(f0,when); o.frequency.exponentialRampToValueAtTime(f1,when+dur*0.35);
  const g=AC.createGain(); g.gain.setValueAtTime(vol,when); g.gain.exponentialRampToValueAtTime(0.001,when+dur);
  o.connect(g); g.connect(out); o.start(when); o.stop(when+dur+0.05);
}
function R(lo,hi){ return lo+Math.random()*(hi-lo); } // random range helper

/* ═══════════════════════════════════════════════════════════════
   FX CHAINS — real DSP, fully self-cleaning after snippetDur+tail
   makeFXChain(fxName, snippetDur) → {input:AudioNode}
   All continuous sources (noise, LFO) are scheduled to stop at
   snippetDur+tail seconds and then disconnected. No zombies.
═══════════════════════════════════════════════════════════════ */

function makeReverbIR(secs) {
  // Fresh IR buffer every time — not cached, sized to this sound
  const len=Math.floor(AC.sampleRate*secs);
  const buf=AC.createBuffer(2,len,AC.sampleRate);
  for(let ch=0;ch<2;ch++){
    const d=buf.getChannelData(ch);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4);
  }
  return buf;
}

function makeFXChain(fxName, snippetDur, seed) {
  if(!seed||seed.length<32) seed=Array.from({length:32},()=>0.5);
  if(!AC||!fxName) return null;
  // tail = extra time after last note for reverb/echo to decay
  const tail = (fxName==='HALL')?3.5 : (fxName==='ROOM')?2.0 : (fxName==='ECHO')?2.5 : 0.8;
  const totalLife = (snippetDur||1) + tail; // seconds until everything is silent
  const now = AC.currentTime;
  const killAt = now + totalLife;

  // Helper: schedule a node to stop+disconnect at killAt
  function autoKill(node, method='stop') {
    const ms = totalLife * 1000;
    setTimeout(()=>{
      try { if(method==='stop') node.stop(); } catch(e){}
      try { node.disconnect(); } catch(e){}
    }, ms + 80); // small extra buffer
  }

  switch(fxName) {

    case 'TAPE': {
      // Soft tape saturation + warm EQ + slow flutter LFO on gain
      const inp=AC.createGain(); inp.gain.value=1;
      const ws=AC.createWaveShaper();
      const cv=new Float32Array(512);
      for(let i=0;i<512;i++){const x=i/256-1; cv[i]=Math.tanh(x*2.2)*0.72;}
      ws.curve=cv; ws.oversample='4x';
      const shelf=AC.createBiquadFilter(); shelf.type='highshelf'; shelf.frequency.value=6500; shelf.gain.value=-4;
      const lo=AC.createBiquadFilter(); lo.type='lowshelf'; lo.frequency.value=180; lo.gain.value=2.5;
      const fltG=AC.createGain(); fltG.gain.value=0.9;
      const lfo=AC.createOscillator(); lfo.frequency.value=SR(seed,0,0.5,1.2);
      const lfoAmt=AC.createGain(); lfoAmt.gain.value=0.05;
      lfo.connect(lfoAmt); lfoAmt.connect(fltG.gain);
      lfo.start(now); lfo.stop(killAt);
      autoKill(lfo,'stop'); autoKill(lfoAmt,'disc'); autoKill(fltG,'disc');
      inp.connect(ws); ws.connect(shelf); shelf.connect(lo); lo.connect(fltG); fltG.connect(masterOut);
      return {input:inp};
    }

    case 'VINYL': {
      // Lo-fi filter + vinyl crackle that stops with the sound
      const inp=AC.createGain(); inp.gain.value=1;
      const lpf=AC.createBiquadFilter(); lpf.type='lowpass'; lpf.frequency.value=SR(seed,0,3000,5000); lpf.Q.value=0.6;
      const hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=SR(seed,1,60,110); hp.Q.value=0.3;
      const outG=AC.createGain(); outG.gain.value=0.82;
      inp.connect(lpf); lpf.connect(hp); hp.connect(outG); outG.connect(masterOut);
      // Crackle: fixed-duration buffer, NOT looping — stops naturally
      const cDur=totalLife;
      const cLen=Math.floor(AC.sampleRate*cDur);
      const cBuf=AC.createBuffer(1,cLen,AC.sampleRate);
      const cd=cBuf.getChannelData(0);
      for(let i=0;i<cLen;i++) cd[i]=Math.random()>0.997?(Math.random()*2-1)*SR(seed,2,0.2,0.6):0;
      const crk=AC.createBufferSource(); crk.buffer=cBuf; crk.loop=false;
      const crkG=AC.createGain(); crkG.gain.value=SR(seed,3,0.14,0.22);
      // Fade crackle out smoothly at end
      crkG.gain.setValueAtTime(crkG.gain.value, now);
      crkG.gain.exponentialRampToValueAtTime(0.001, killAt-0.05);
      const crkF=AC.createBiquadFilter(); crkF.type='bandpass'; crkF.frequency.value=1800; crkF.Q.value=0.5;
      crk.connect(crkF); crkF.connect(crkG); crkG.connect(masterOut);
      crk.start(now); // plays exactly cDur seconds then stops
      autoKill(crk,'stop'); autoKill(crkG,'disc');
      return {input:inp};
    }

    case 'ROOM': {
      const inp=AC.createGain(); inp.gain.value=0.88;
      const conv=AC.createConvolver(); conv.buffer=makeReverbIR(SR(seed,4,0.7,1.8));
      const wet=AC.createGain(); wet.gain.value=SR(seed,5,0.32,0.52);
      const dry=AC.createGain(); dry.gain.value=0.78;
      // Fade wet out after input stops so tail decays naturally then disconnects
      wet.gain.setValueAtTime(wet.gain.value, now);
      wet.gain.setValueAtTime(wet.gain.value, killAt - tail);
      wet.gain.exponentialRampToValueAtTime(0.001, killAt - 0.05);
      inp.connect(conv); conv.connect(wet); wet.connect(masterOut);
      inp.connect(dry); dry.connect(masterOut);
      autoKill(wet,'disc'); autoKill(conv,'disc');
      return {input:inp};
    }

    case 'HALL': {
      const inp=AC.createGain(); inp.gain.value=0.82;
      const conv=AC.createConvolver(); conv.buffer=makeReverbIR(SR(seed,6,2.2,3.5));
      const wet=AC.createGain(); wet.gain.value=SR(seed,7,0.42,0.62);
      const dry=AC.createGain(); dry.gain.value=0.58;
      const lpf=AC.createBiquadFilter(); lpf.type='lowpass'; lpf.frequency.value=3800;
      wet.gain.setValueAtTime(wet.gain.value, now);
      wet.gain.setValueAtTime(wet.gain.value, killAt - tail);
      wet.gain.exponentialRampToValueAtTime(0.001, killAt - 0.05);
      inp.connect(conv); conv.connect(lpf); lpf.connect(wet); wet.connect(masterOut);
      inp.connect(dry); dry.connect(masterOut);
      autoKill(wet,'disc'); autoKill(conv,'disc');
      return {input:inp};
    }

    case 'ECHO': {
      const inp=AC.createGain(); inp.gain.value=1;
      const delayT=SR(seed,8,0.16,0.38);
      const dly=AC.createDelay(1.5); dly.delayTime.value=delayT;
      const fb=AC.createGain(); fb.gain.value=SR(seed,9,0.28,0.52);
      const wet=AC.createGain(); wet.gain.value=SR(seed,10,0.38,0.58);
      const dry=AC.createGain(); dry.gain.value=0.82;
      const lpf=AC.createBiquadFilter(); lpf.type='lowpass'; lpf.frequency.value=3200;
      // Fade feedback out so echoes die
      fb.gain.setValueAtTime(fb.gain.value, now);
      fb.gain.exponentialRampToValueAtTime(0.001, killAt - 0.1);
      inp.connect(dly); dly.connect(fb); fb.connect(lpf); lpf.connect(dly);
      dly.connect(wet); wet.connect(masterOut);
      inp.connect(dry); dry.connect(masterOut);
      autoKill(dly,'disc'); autoKill(fb,'disc');
      return {input:inp};
    }

    case 'LOFI': {
      const inp=AC.createGain(); inp.gain.value=1.1;
      const ws=AC.createWaveShaper();
      const c=new Float32Array(256);
      for(let i=0;i<256;i++){const x=i/128-1; c[i]=Math.tanh(x*1.5)*0.82;}
      ws.curve=c;
      const lpf=AC.createBiquadFilter(); lpf.type='lowpass'; lpf.frequency.value=SR(seed,11,1100,2600); lpf.Q.value=SR(seed,12,0.8,2.5);
      const hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=SR(seed,13,80,180);
      const outG=AC.createGain(); outG.gain.value=0.78;
      // Fixed-duration hiss — NOT looping
      const hLen=Math.floor(AC.sampleRate*totalLife);
      const hBuf=AC.createBuffer(1,hLen,AC.sampleRate);
      const hd=hBuf.getChannelData(0);
      for(let i=0;i<hLen;i++) hd[i]=(Math.random()*2-1);
      const hSrc=AC.createBufferSource(); hSrc.buffer=hBuf; hSrc.loop=false;
      const hG=AC.createGain(); hG.gain.value=SR(seed,14,0.012,0.032);
      // Fade hiss out
      hG.gain.setValueAtTime(hG.gain.value, now);
      hG.gain.exponentialRampToValueAtTime(0.001, killAt-0.05);
      const hF=AC.createBiquadFilter(); hF.type='lowpass'; hF.frequency.value=900;
      hSrc.connect(hF); hF.connect(hG); hG.connect(masterOut);
      hSrc.start(now); // stops automatically when buffer ends
      autoKill(hSrc,'stop'); autoKill(hG,'disc');
      inp.connect(ws); ws.connect(lpf); lpf.connect(hp); hp.connect(outG); outG.connect(masterOut);
      return {input:inp};
    }

    case 'CRUSH': {
      const inp=AC.createGain(); inp.gain.value=1.4;
      const ws=AC.createWaveShaper();
      const bits=Math.floor(SR(seed,15,3,6));
      const steps=Math.pow(2,bits);
      const c=new Float32Array(1024);
      for(let i=0;i<1024;i++){const x=i/512-1; c[i]=Math.round(x*steps)/steps;}
      ws.curve=c;
      const lpf=AC.createBiquadFilter(); lpf.type='lowpass'; lpf.frequency.value=SR(seed,16,1800,4500);
      const outG=AC.createGain(); outG.gain.value=0.62;
      inp.connect(ws); ws.connect(lpf); lpf.connect(outG); outG.connect(masterOut);
      return {input:inp};
    }

    case 'FUZZ': {
      const inp=AC.createGain(); inp.gain.value=2.8;
      const ws=AC.createWaveShaper();
      const c=new Float32Array(512);
      for(let i=0;i<512;i++){const x=i/256-1; c[i]=Math.max(-0.68,Math.min(0.68,x*4.5));}
      ws.curve=c;
      const filt=AC.createBiquadFilter(); filt.type='bandpass'; filt.frequency.value=SR(seed,17,500,1600); filt.Q.value=SR(seed,18,1,2.5);
      const outG=AC.createGain(); outG.gain.value=0.42;
      inp.connect(ws); ws.connect(filt); filt.connect(outG); outG.connect(masterOut);
      return {input:inp};
    }

    default: return null;
  }
}

// Returns the audio destination for a snippet — masterOut or an FX chain input
// FX chain is rebuilt each call (nodes can't be reused), but params seeded from item.seed
function getOut(item, snippetDur) {
  if(!item||!item.fxOn||!item.fx) return masterOut;
  if(item.type&&item.type.isDrum) return masterOut; // drums always dry
  const seed = item.seed || [];
  const chain = makeFXChain(item.fx, snippetDur||1.5, seed);
  return chain ? chain.input : masterOut;
}

function noiseBuffer(dur) {
  // Reuse the pre-built noiseBuf — cheaper on iOS, avoids per-hit allocation.
  // BufferSource always plays from the start so reuse is safe.
  return noiseBuf;
}

let _wsCache = {};
function waveshaper(amt) {
  const key = amt.toFixed(2);
  if (_wsCache[key] && AC) return _wsCache[key];
  const ws = AC.createWaveShaper();
  const c2 = new Float32Array(256);
  for (let i = 0; i < 256; i++) {
    const x = (i * 2) / 256 - 1;
    c2[i] = ((Math.PI + amt * 80) * x) / (Math.PI + amt * 80 * Math.abs(x));
  }
  ws.curve = c2;
  _wsCache[key] = ws;
  return ws;
}

// ── KICK ──────────────────────────────────────────────────────

function kick808(w, out) {
  if (!AC) return;
  out = out||masterOut;
  // Main body: sine sweep 155→38 Hz
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(155, w); o.frequency.exponentialRampToValueAtTime(38, w + 0.08);
  g.gain.setValueAtTime(1.3, w); g.gain.exponentialRampToValueAtTime(0.001, w + 0.38);
  o.connect(g); g.connect(out); o.start(w); o.stop(w + 0.42);
  // Click transient: waveshaped triangle
  const o2 = AC.createOscillator(), g2 = AC.createGain(), ws = waveshaper(0.4);
  o2.type = 'triangle'; o2.frequency.value = 120;
  g2.gain.setValueAtTime(0.5, w); g2.gain.exponentialRampToValueAtTime(0.001, w + 0.04);
  o2.connect(ws); ws.connect(g2); g2.connect(out); o2.start(w); o2.stop(w + 0.06);
}

function kick909(w, out) {
  out = out||masterOut;

  o.frequency.exponentialRampToValueAtTime(40, w + 0.05);
  g.gain.setValueAtTime(1.4, w); g.gain.exponentialRampToValueAtTime(0.001, w + 0.28);
  o.connect(g); g.connect(out); o.start(w); o.stop(w + 0.32);

  ns.connect(nhp); nhp.connect(ng); ng.connect(out); ns.start(w);
}

   SYNTH VOICES — from uploaded code, adapted to AC/masterOut
   Core: osc + sub + filter envelope + LFO pitch wobble
═══════════════════════════════════════════════════════════════ */

function midiHz(m) { return 440 * Math.pow(2, (m - 69) / 12); }

// Core voice engine — mirrors playSynth from the uploaded code
// wave: oscillator waveform | filterFreq: peak cutoff | vol: peak amplitude
// seed param kept for snippet API compatibility
function playSynthVoice(freq, w, dur, wave, filterFreq, vol, out) {
  if (!AC) return;
  out = out||masterOut;
  const osc = AC.createOscillator(); osc.type = wave; osc.frequency.value = freq;
  const sub = AC.createOscillator(); sub.type = 'sine'; sub.frequency.value = freq / 2;
  // Filter envelope: closed → open → decay
  const filt = AC.createBiquadFilter(); filt.type = 'lowpass';
  filt.frequency.setValueAtTime(filterFreq * 0.7, w);
  filt.frequency.exponentialRampToValueAtTime(filterFreq, w + 0.004);
  filt.frequency.exponentialRampToValueAtTime(filterFreq * 0.35, w + dur);
  filt.Q.value = 3 + R(0, 4);
  // Amplitude envelope: fast attack, sustain, decay
  const env = AC.createGain();
  env.gain.setValueAtTime(0.0001, w);
  env.gain.linearRampToValueAtTime(vol, w + 0.008);
  env.gain.exponentialRampToValueAtTime(vol * 0.37, w + 0.12);
  env.gain.exponentialRampToValueAtTime(0.001, w + dur);
  // Sub oscillator mix
  const subG = AC.createGain(); subG.gain.value = 0.22;
  // LFO pitch wobble for analog warmth
  const lfo = AC.createOscillator(); lfo.frequency.value = 3.5 + R(0, 2);
  const lfoG = AC.createGain(); lfoG.gain.value = freq * 0.0015;
  lfo.connect(lfoG); lfoG.connect(osc.frequency);
  lfo.start(w); lfo.stop(w + dur + 0.05);
  osc.connect(filt); filt.connect(env);
  sub.connect(subG); subG.connect(env);
  env.connect(out);
  osc.start(w); osc.stop(w + dur + 0.05);
  sub.start(w); sub.stop(w + dur + 0.05);
}

// Dual detuned saws — Moog-ish lead/arp
function dualSaw(freq, w, dur, out, seed=[]) {
  if (!AC) return; out = out||masterOut;
  const det = R(0.998, 1.004);
  [1, det].forEach(d => {
    const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = freq * d;
    const vcf = AC.createBiquadFilter(); vcf.type = 'lowpass'; vcf.Q.value = R(3, 8);
    const c0 = R(600,1800), cPk = R(1200,3200), cEnd = R(300,900);
    vcf.frequency.setValueAtTime(c0, w);
    vcf.frequency.exponentialRampToValueAtTime(cPk, w + 0.005);
    vcf.frequency.exponentialRampToValueAtTime(cEnd, w + dur * R(0.35,0.6));
    const env = AC.createGain();
    env.gain.setValueAtTime(R(0.28,0.4), w); env.gain.exponentialRampToValueAtTime(0.001, w + dur);
    o.connect(vcf); vcf.connect(env); env.connect(out);
    o.start(w); o.stop(w + dur + 0.05);
  });
}

// Dual saw bass — lower octave, fatter filter
function dualSawBass(freq, w, dur, out, seed=[]) {
  if (!AC) return; out = out||masterOut;
  const f = freq * 0.5; // drop an octave
  const det = R(0.997, 1.003);
  [1, det].forEach(d => {
    const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f * d;
    const vcf = AC.createBiquadFilter(); vcf.type = 'lowpass'; vcf.Q.value = R(4, 10);
    const c0 = R(400,1000), cPk = R(900,2200), cEnd = R(200,600);
    vcf.frequency.setValueAtTime(c0, w);
    vcf.frequency.exponentialRampToValueAtTime(cPk, w + 0.005);
    vcf.frequency.exponentialRampToValueAtTime(cEnd, w + dur * R(0.3,0.55));
    const env = AC.createGain();
    env.gain.setValueAtTime(R(0.55,0.75), w); env.gain.exponentialRampToValueAtTime(0.001, w + dur);
    o.connect(vcf); vcf.connect(env); env.connect(out);
    o.start(w); o.stop(w + dur + 0.05);
  });
}

// Dark pad — 4 detuned saws/squares, slow attack (Juno-style)
function darkPad(freq, w, dur, out, seed=[]) {
  if (!AC) return; out = out||masterOut;
  [1, 1.0035, 0.997, 1.007].forEach((det, i) => {
    const o = AC.createOscillator();
    o.type = i % 2 === 0 ? 'sawtooth' : 'square';
    o.frequency.value = freq * det;
    const lpf = AC.createBiquadFilter(); lpf.type = 'lowpass';
    lpf.frequency.value = R(700, 2000); lpf.Q.value = R(0.4, 0.8);
    const env = AC.createGain();
    env.gain.setValueAtTime(0.0001, w);
    env.gain.linearRampToValueAtTime(R(0.07, 0.12), w + R(0.004, 0.012));
    env.gain.exponentialRampToValueAtTime(0.001, w + dur);
    o.connect(lpf); lpf.connect(env); env.connect(out);
    o.start(w); o.stop(w + dur + 0.05);
  });
}

// Pulse lead — square wave through filter, tight and biting
function pulseLead(freq, w, dur, out, seed=[]) {
  playSynthVoice(freq, w, dur, 'square', R(600, 1800), R(0.48, 0.68), out);
}

// Pure sine sub bass — 808 melodic style with pitch envelope
function subBass(freq, w, dur, out, seed=[]) {
  if (!AC) return; out = out||masterOut;
  const f = freq * 0.5;
  const o = AC.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(f * R(1.02, 1.05), w);
  o.frequency.exponentialRampToValueAtTime(f, w + R(0.03, 0.07));
  const env = AC.createGain();
  env.gain.setValueAtTime(R(0.7, 0.9), w); env.gain.exponentialRampToValueAtTime(0.001, w + dur);
  o.connect(env); env.connect(out); o.start(w); o.stop(w + dur + 0.05);
}

// 808 boom bass — tuned sine with pitch drop, full-range
function boom808(freq, w, dur, out, seed=[]) {
  if (!AC) return; out = out||masterOut;
  const o = AC.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(freq * R(1.04, 1.08), w);

  o.connect(env); env.connect(out); o.start(w); o.stop(w + dur + 0.05);
}

function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

/* ═══════════════════════════════════════════════════════════════
   SONG KEY — locked on first melodic drop
═══════════════════════════════════════════════════════════════ */
let songKey = null;

function lockSongKey(root, scale) {
  if(songKey) return;
  songKey = {root, scale};
}

function makeSeed() {
  return Array.from({length:32}, ()=>Math.random());
}

function SR(seed, idx, lo, hi) {
  const v = seed[idx % seed.length];
  return lo + v*(hi-lo);
}

// Swing helper — deterministic when seeded (seed[idx] used if provided)
function sw(t, swing, seedArr, idx) {
  if (!swing) return t;
  const r = (seedArr && idx !== undefined) ? seedArr[idx % seedArr.length] : Math.random();
  return t + swing * (r > 0.5 ? 1 : -1);
}

const ROOTS    = [36,38,40,41,43,45,47,48];
const ROOTS_HI = [48,50,52,53,55,57];
let uid = 0;
let usedCombos = new Set();

function makeItem(snippet, shape, color, root, scale) {
  const seed = makeSeed();
  return { id:++uid, type:snippet, root, scale, shape, color, fx:'TAPE', fxOn:false, seed, placed:false };
}

function pickUnusedCombo() {
  const shapes = shuffle(ALL_SHAPES);
  const colors = shuffle(ALL_COLORS);
  for(const sh of shapes) for(const co of colors) {
    const key=sh+'|'+co;
    if(!usedCombos.has(key)) return {shape:sh, color:co};
  }
  return {shape:shapes[0], color:colors[0]};
}

function spawnRoot(snippet) {
  if(snippet.isDrum) return 48;
  const role = SNIPPET_ROLES[snippet.id];
  return ((role==='bass') ? ROOTS : ROOTS_HI)[Math.floor(Math.random()*((role==='bass')?ROOTS.length:ROOTS_HI.length))];
}

function makeSpawnedItem(snippet) {
  const {shape, color} = pickUnusedCombo();
  usedCombos.add(shape+'|'+color);
  const root  = songKey ? songKey.root  : spawnRoot(snippet);
  const scale = songKey ? songKey.scale : SC_KEYS[Math.floor(Math.random()*SC_KEYS.length)];
  return makeItem(snippet, shape, color, root, scale);
}

function releaseCombo(item) {
  if(item) usedCombos.delete(item.shape+'|'+item.color);
}

/* ─── Palette composition helpers ─────────────────────────── */
function palDrumCount()  { return palette.filter(p=>p&&p.type.isDrum).length; }
function palMelCount()   { return palette.filter(p=>p&&!p.type.isDrum).length; }
function palBassCount()  { return palette.filter(p=>p&&!p.type.isDrum&&SNIPPET_ROLES[p.type.id]==='bass').length; }

// 3 drums / 5 melodic. Melodic heavily biased toward bass.
function pickNextSnippet() {
  const dc = palDrumCount();
  const mc = palMelCount();
  if(dc < 3 && mc >= 5) return DRUM_SNIPPETS[Math.floor(Math.random()*DRUM_SNIPPETS.length)];
  if(mc < 5 && dc >= 3) return pickMelodicSnippet();
  if(Math.random() < 0.35) return DRUM_SNIPPETS[Math.floor(Math.random()*DRUM_SNIPPETS.length)];
  return pickMelodicSnippet();
}

function pickMelodicSnippet() {
  // 65% bass, 25% lead/stab, 10% pad
  const bc = palBassCount();
  if(bc < 3 && Math.random() < 0.8)
    return BASS_SNIPPETS[Math.floor(Math.random()*BASS_SNIPPETS.length)];
  const roll = Math.random();
  if(roll < 0.65) return BASS_SNIPPETS[Math.floor(Math.random()*BASS_SNIPPETS.length)];
  if(roll < 0.90) return NON_BASS_MEL[Math.floor(Math.random()*NON_BASS_MEL.length)];
  return MELODIC_SNIPPETS[Math.floor(Math.random()*MELODIC_SNIPPETS.length)];
}

function spawnItem() {
  return makeSpawnedItem(pickNextSnippet());
}

function rebalancePalette() {
  const dc = palDrumCount();
  const mc = palMelCount();
  if(dc <= 3 && mc <= 5) return;
  if(dc > 3) {
    const drumIdxs = palette.map((p,i)=>p&&p.type.isDrum?i:-1).filter(i=>i>=0);
    shuffle(drumIdxs).slice(0, dc-3).forEach(i=>{
      releaseCombo(palette[i]);
      palette[i] = makeSpawnedItem(pickMelodicSnippet());
    });
  } else if(mc > 5) {
    const melIdxs = palette.map((p,i)=>p&&!p.type.isDrum?i:-1).filter(i=>i>=0);
    shuffle(melIdxs).slice(0, mc-5).forEach(i=>{
      releaseCombo(palette[i]);
      palette[i] = makeSpawnedItem(DRUM_SNIPPETS[Math.floor(Math.random()*DRUM_SNIPPETS.length)]);
    });
  }
}

/* ═══════════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════════ */
const PAL_SIZE = 8;
let palette  = [];
let seqCells = [ new Array(8).fill(null), new Array(8).fill(null) ];
let steps    = 8;
let bpm      = 120;
let playing  = false;
let curStep  = 0;
let schedTmr = null;
let nextBeat = 0;

function initState() {
  usedCombos.clear();
  songKey = null;
  palette = [];
  // Always 4 drums + 4 synth (even split)
  const drumPool = shuffle([...DRUM_SNIPPETS]);
  const bassPool = shuffle([...BASS_SNIPPETS]);
  const leadPool = shuffle([...NON_BASS_MEL]);
  const melPool  = shuffle([...bassPool, ...leadPool]);
  const chosen = [
    ...drumPool.slice(0,4),
    ...melPool.slice(0,4),
  ];
  shuffle(chosen).forEach(snippet => {
    const {shape, color} = pickUnusedCombo();
    usedCombos.add(shape+'|'+color);
    palette.push(makeItem(snippet, shape, color, spawnRoot(snippet),
      SC_KEYS[Math.floor(Math.random()*SC_KEYS.length)]));
  });
}

// Swap all palette shapes for fresh ones — keeps sequencer intact
function shufflePalette() {
  // Clear palette combos and rebuild with new random picks
  palette.forEach(p => releaseCombo(p));
  usedCombos.clear();
  songKey = null;
  const drumPool = shuffle([...DRUM_SNIPPETS]);
  const bassPool = shuffle([...BASS_SNIPPETS]);
  const leadPool = shuffle([...NON_BASS_MEL]);
  const melPool  = shuffle([...bassPool, ...leadPool]);
  const chosen = [
    ...drumPool.slice(0,4),
    ...melPool.slice(0,4),
  ];
  palette = [];
  shuffle(chosen).forEach(snippet => {
    const {shape, color} = pickUnusedCombo();
    usedCombos.add(shape+'|'+color);
    palette.push(makeItem(snippet, shape, color, spawnRoot(snippet),
      SC_KEYS[Math.floor(Math.random()*SC_KEYS.length)]));
  });
  renderPalette();
}

/* ── snippet playback ──────────────────────────────────────── */

// Estimate snippet duration without calling generate() (which would fire audio)
function snippetDurEst(sd) {
  return sd * 2.5 + 1.5;
}

function playSnippetNow(item) {
  if(!AC) return;
  try {
    resumeAC();
    const w = AC.currentTime + 0.02;
    const sd = stepDur();
    const seed = item.seed || makeSeed();
    const out = getOut(item, snippetDurEst(sd));
    const evts = item.type.generate(item.root, item.scale, sd, out, seed);
    evts.forEach(ev => { try { const t = w + ev.t; if (t >= AC.currentTime) ev.fn(t); } catch(e){} });
  } catch(e) {}
}

function playSnippetAt(item, when) {
  if(!AC) return;
  try {
    const sd = stepDur();
    const seed = item.seed || makeSeed();
    const out = getOut(item, snippetDurEst(sd));
    const evts = item.type.generate(item.root, item.scale, sd, out, seed);
    evts.forEach(ev => { try { const t = when + ev.t; if (t >= AC.currentTime) ev.fn(t); } catch(e){} });
  } catch(e) {}
}

/* ═══════════════════════════════════════════════════════════════
   RENDER
═══════════════════════════════════════════════════════════════ */
function pts(n, r, off=0) {
  return Array.from({length:n},(_,i)=>{
    const a=(i/n)*Math.PI*2-Math.PI/2+off;
    return `${(Math.cos(a)*r).toFixed(2)},${(Math.sin(a)*r).toFixed(2)}`;
  }).join(' ');
}

function shapeSVG(shape, color, anim, small=false) {
  const r=small?32:44, sw=small?1.5:2, fo=small?0.22:0.26;
  const spd=(3+Math.random()*7).toFixed(1)+'s';
  const dir=Math.random()>0.5?'':'animation-direction:reverse;';
  const timing=anim==='spin'?'linear':'ease-in-out';
  const altDir=anim!=='spin'?'animation-direction:alternate;':'';
  const style=`animation-name:shape-anim-${anim};animation-duration:${spd};animation-timing-function:${timing};animation-iteration-count:infinite;${altDir}${dir}`;
  let inner='';
  switch(shape){
    case 'triangle': inner=`<polygon points="${pts(3,r)}" fill="${color}" fill-opacity="${fo}" stroke="${color}" stroke-width="${sw}"/>`; break;
    case 'square':   inner=`<rect x="${-r*.78}" y="${-r*.78}" width="${r*1.56}" height="${r*1.56}" fill="${color}" fill-opacity="${fo}" stroke="${color}" stroke-width="${sw}"/>`; break;
    case 'pentagon': inner=`<polygon points="${pts(5,r)}" fill="${color}" fill-opacity="${fo}" stroke="${color}" stroke-width="${sw}"/>`; break;
    case 'hexagon':  inner=`<polygon points="${pts(6,r)}" fill="${color}" fill-opacity="${fo}" stroke="${color}" stroke-width="${sw}"/>`; break;
    case 'diamond':  inner=`<polygon points="0,${-r} ${r*.65},0 0,${r} ${-r*.65},0" fill="${color}" fill-opacity="${fo}" stroke="${color}" stroke-width="${sw}"/>`; break;
    case 'circle':   inner=`<circle cx="0" cy="0" r="${r}" fill="${color}" fill-opacity="${fo}" stroke="${color}" stroke-width="${sw}"/><circle cx="0" cy="0" r="${r*.42}" fill="${color}" fill-opacity="${fo*.8}" stroke="${color}" stroke-width="${sw*.55}"/>`; break;
    case 'ring':     inner=`<circle cx="0" cy="0" r="${r}" fill="${color}" fill-opacity="${fo}" stroke="${color}" stroke-width="${sw}"/><circle cx="0" cy="0" r="${r*.52}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-dasharray="5 5"/>`; break;
    case 'star': {
      const inn=r*.42;
      const pp=Array.from({length:10},(_,i)=>{const a=(i/10)*Math.PI*2-Math.PI/2; const rr=i%2===0?r:inn; return `${(Math.cos(a)*rr).toFixed(2)},${(Math.sin(a)*rr).toFixed(2)}`;}).join(' ');
      inner=`<polygon points="${pp}" fill="${color}" fill-opacity="${fo}" stroke="${color}" stroke-width="${sw}"/>`;
      break;
    }
    case 'cross': {
      const t=r*.28,l=r;
      inner=`<polygon points="${-t},${-l} ${t},${-l} ${t},${-t} ${l},${-t} ${l},${t} ${t},${t} ${t},${l} ${-t},${l} ${-t},${t} ${-l},${t} ${-l},${-t} ${-t},${-t}" fill="${color}" fill-opacity="${fo}" stroke="${color}" stroke-width="${sw}"/>`;
      break;
    }
    default: inner=`<circle cx="0" cy="0" r="${r}" fill="${color}" fill-opacity="${fo}" stroke="${color}" stroke-width="${sw}"/>`;
  }
  const sz=small?80:100;
  return `<svg viewBox="${-sz/2} ${-sz/2} ${sz} ${sz}" xmlns="http://www.w3.org/2000/svg"><g style="${style}">${inner}</g></svg>`;
}

function renderPalette() {
  ['palette','palette2'].forEach((id,ri) => {
    const el=document.getElementById(id);
    el.innerHTML='';
    for(let i=0;i<4;i++){
      const idx=ri*4+i;
      const cell=document.createElement('div');
      cell.className='shape-cell'+((!palette[idx])?' gone':'');
      cell.dataset.palIdx=idx;
      if(palette[idx]){
        const item=palette[idx];
        const wrap=document.createElement('div');
        wrap.className='shape-svg-wrap';
        wrap.innerHTML=shapeSVG(item.shape,item.color,item.type.anim);
        cell.appendChild(wrap);
        // Preview on tap/click — fires sound immediately
        const preview = ()=>{
          if(dragging) return;
          playSnippetNow(item);
          const svg=wrap.querySelector('svg');
          svg.classList.remove('playing-burst');
          void svg.offsetWidth; // reflow to restart anim
          svg.classList.add('playing-burst');
          setTimeout(()=>svg.classList.remove('playing-burst'),320);
        };
        cell.addEventListener('click', preview);
        cell.addEventListener('touchstart', e=>{
          e.preventDefault();
          const t0=e.touches[0];
          const sx=t0.clientX, sy=t0.clientY;
          let dragStarted=false;

          const onMove=mv=>{
            if(dragStarted) return;
            const dx=mv.touches[0].clientX-sx, dy=mv.touches[0].clientY-sy;
            if(Math.abs(dx)>8||Math.abs(dy)>8){
              dragStarted=true;
              document.removeEventListener('touchmove',onMove);
              document.removeEventListener('touchend',onEnd);
              // start drag
              const palIdx=parseInt(cell.dataset.palIdx);
              if(isNaN(palIdx)||!palette[palIdx]) return;
              dragging={item:palette[palIdx],src:'pal',palIdx};
              showGhost(dragging.item,mv.touches[0].clientX,mv.touches[0].clientY);
              addDragListeners();
            }
          };
          const onEnd=()=>{
            document.removeEventListener('touchmove',onMove);
            document.removeEventListener('touchend',onEnd);
            if(!dragStarted) preview();
          };
          document.addEventListener('touchmove',onMove,{passive:true});
          document.addEventListener('touchend',onEnd,{passive:true});
        },{passive:false});
      }
      el.appendChild(cell);
    }
  });
}

function seqSVG(item){ return shapeSVG(item.shape,item.color,item.type.anim,true); }

function renderSeq() {
  [0,1].forEach(r=>{
    const grid=document.getElementById(r===0?'seqA':'seqB');
    grid.innerHTML='';
    for(let c=0;c<8;c++){
      const gs=r*8+c, active=gs<steps;
      const sq=document.createElement('div');
      sq.className='seq-sq'+(!active?' inactive':'');
      sq.dataset.row=r; sq.dataset.col=c;
      const cell=seqCells[r][c];
      if(cell&&active) sq.innerHTML=seqSVG(cell);
      if(active){
        sq.addEventListener('touchstart',onSeqTouchStart,{passive:false});
        sq.addEventListener('click',onSeqClick);
      }
      grid.appendChild(sq);
    }
  });
}

function renderFX() {
  [0,1].forEach(r=>{
    const row=document.getElementById(r===0?'fxA':'fxB');
    row.innerHTML='';
    for(let c=0;c<8;c++){
      const gs=r*8+c, active=gs<steps;
      const wrap=document.createElement('div'); wrap.className='fx-dot-wrap';
      const btn=document.createElement('button');
      const cell=seqCells[r][c];
      const hasFx=cell&&cell.fxOn;
      btn.className='fx-dot'+(!active?' inactive-fx':'')+(hasFx?' has-fx':'');
      btn.dataset.row=r; btn.dataset.col=c;
      // Show FX name if on
      const dot=document.createElement('div'); dot.className='fx-dot-inner';
      btn.appendChild(dot);
      if(hasFx){
        const lbl=document.createElement('span'); lbl.className='fx-dot-label';
        lbl.textContent=cell.fx; btn.appendChild(lbl);
      }
      if(cell&&active){
        const handler=e=>{
          e.preventDefault(); e.stopPropagation();
          if(cell.fxOn){
            // Toggle off
            cell.fxOn=false;
          } else {
            // Toggle on with new random FX
            cell.fx=FX_LIST[Math.floor(Math.random()*FX_LIST.length)];
            cell.fxOn=true;
          }
          renderFX();
          const rect=btn.getBoundingClientRect();
          showFXPop(cell.fxOn?cell.fx:'off', rect.left+rect.width/2, rect.top);
        };
        btn.addEventListener('click',handler);
        btn.addEventListener('touchend',handler,{passive:false});
      }
      wrap.appendChild(btn); row.appendChild(wrap);
    }
  });
}

function renderAll() { renderPalette(); renderSeq(); renderFX(); }

/* ── fx popup ──────────────────────────────────────────────── */
let fxPopTmr=null;
function showFXPop(label,x,y){
  const pop=document.getElementById('fxPop');
  pop.textContent=label; pop.style.left=x+'px'; pop.style.top=y+'px';
  pop.classList.add('show');
  clearTimeout(fxPopTmr);
  fxPopTmr=setTimeout(()=>pop.classList.remove('show'),900);
}

/* ═══════════════════════════════════════════════════════════════
   SEQUENCER ENGINE
═══════════════════════════════════════════════════════════════ */
function stepDur() { return 60/bpm*0.5; }

function startSeq() {
  resumeAC(); playing=true; curStep=0; nextBeat=AC.currentTime+0.05;
  schedLoop();
  document.getElementById('playBtn').classList.add('playing');
  document.getElementById('playIcon').innerHTML='<rect x="3" y="2" width="4" height="12"/><rect x="9" y="2" width="4" height="12"/>';
}

function stopSeq() {
  playing=false; clearTimeout(schedTmr); curStep=0;
  document.getElementById('playBtn').classList.remove('playing');
  document.getElementById('playIcon').innerHTML='<polygon points="4,2 14,8 4,14"/>';
  document.getElementById('playIcon').style.fill='var(--ink)';
}

function schedLoop() {
  if(!playing) return;
  try {
    while(nextBeat < AC.currentTime+0.2){
      const stepToFire=curStep;
      try { fireStep(stepToFire, nextBeat); } catch(e){}
      curStep=(curStep+1)%steps;
      nextBeat+=stepDur();
    }
  } catch(e){}
  schedTmr=setTimeout(schedLoop,25);
}

function fireStep(globalStep, when) {
  const row=Math.floor(globalStep/8), col=globalStep%8;
  const cell=seqCells[row][col];
  if(cell) playSnippetAt(cell, when);

  const delay=Math.max(0,(when-AC.currentTime)*1000);
  setTimeout(()=>{
    requestAnimationFrame(()=>{
      const sq=document.querySelector(`.seq-sq[data-row="${row}"][data-col="${col}"]`);
      if(sq){
        sq.classList.add('beat-flash');
        if(cell){ sq.classList.add('seq-playing'); sq.querySelector('svg')?.classList.add('shape-jitter'); }
        setTimeout(()=>{
          sq.classList.remove('beat-flash','seq-playing');
          sq.querySelector('svg')?.classList.remove('shape-jitter');
        }, Math.min(280,stepDur()*900));
      }
    });
  }, delay);
}

/* ═══════════════════════════════════════════════════════════════
   DRAG & DROP
═══════════════════════════════════════════════════════════════ */
let dragging=null;
const ghost=document.getElementById('ghost');
const voidEl=document.getElementById('voidRing');

function showGhost(item,x,y){
  ghost.innerHTML=shapeSVG(item.shape,item.color,item.type.anim);
  ghost.style.display='block'; ghost.style.left=x+'px'; ghost.style.top=y+'px';
}

function onPalTouchStart(e){
  e.preventDefault();
  const t=e.touches[0];
  const cell=e.currentTarget;
  const palIdx=parseInt(cell.dataset.palIdx);
  if(isNaN(palIdx)||!palette[palIdx]) return;
  dragging={item:palette[palIdx],src:'pal',palIdx};
  showGhost(dragging.item,t.clientX,t.clientY);
  addDragListeners();
}

function onSeqTouchStart(e){
  e.preventDefault();
  const t=e.touches[0];
  const sq=e.currentTarget;
  const r=parseInt(sq.dataset.row), c=parseInt(sq.dataset.col);
  if(!seqCells[r][c]) return;
  dragging={item:seqCells[r][c],src:'seq',sRow:r,sCol:c};
  seqCells[r][c]=null; renderSeq(); renderFX();
  showGhost(dragging.item,t.clientX,t.clientY);
  addDragListeners();
}

function addDragListeners(){
  document.addEventListener('touchmove',onTMove,{passive:false});
  document.addEventListener('touchend', onTEnd, {passive:false});
}

function onTMove(e){
  e.preventDefault();
  const t=e.touches[0];
  ghost.style.left=t.clientX+'px'; ghost.style.top=t.clientY+'px';
  document.querySelectorAll('.seq-sq').forEach(el=>el.classList.remove('drop-hover'));
  const el=document.elementFromPoint(t.clientX,t.clientY);
  if(el?.classList.contains('seq-sq')&&!el.classList.contains('inactive')) el.classList.add('drop-hover');
  const vr=voidEl.getBoundingClientRect();
  voidEl.classList.toggle('over',t.clientX>vr.left&&t.clientX<vr.right&&t.clientY>vr.top&&t.clientY<vr.bottom);
}

function onTEnd(e){
  document.removeEventListener('touchmove',onTMove);
  document.removeEventListener('touchend',onTEnd);
  ghost.style.display='none';
  document.querySelectorAll('.seq-sq').forEach(el=>el.classList.remove('drop-hover'));
  voidEl.classList.remove('over');
  if(!dragging) return;

  const t=e.changedTouches[0];
  const el=document.elementFromPoint(t.clientX,t.clientY);

  if(el?.classList.contains('seq-sq')&&!el.classList.contains('inactive')){
    dropOnCell(parseInt(el.dataset.row),parseInt(el.dataset.col));
    dragging=null; return;
  }
  const vr=voidEl.getBoundingClientRect();
  if(t.clientX>vr.left&&t.clientX<vr.right&&t.clientY>vr.top&&t.clientY<vr.bottom){
    dissolve(); dragging=null; return;
  }
  if(dragging.src==='seq'){
    seqCells[dragging.sRow][dragging.sCol]=dragging.item;
    renderSeq(); renderFX();
  }
  dragging=null;
}

function onSeqClick(e){
  if(dragging) return;
  const sq=e.currentTarget;
  const r=parseInt(sq.dataset.row), c=parseInt(sq.dataset.col);
  if(seqCells[r][c]){ seqCells[r][c]=null; renderSeq(); renderFX(); }
}

function dropOnCell(r,c){
  const displaced = seqCells[r][c];
  const item = dragging.item;
  seqCells[r][c] = item;

  // Lock song key on first melodic placement and re-key palette
  if(!item.type.isDrum && !songKey) {
    lockSongKey(item.root, item.scale);
    palette.forEach(p=>{ if(p&&!p.type.isDrum){ p.root=songKey.root; p.scale=songKey.scale; } });
  }

  if(dragging.src==='pal'){
    releaseCombo(palette[dragging.palIdx]);
    palette[dragging.palIdx] = spawnItem();
    rebalancePalette();
    renderPalette();
  }
  if(displaced){
    const free = palette.findIndex(p=>p===null);
    if(free>=0){ releaseCombo(palette[free]); palette[free]=displaced; renderPalette(); }
  }
  renderSeq(); renderFX();
}

function dissolve(){
  if(dragging.src==='pal'){
    releaseCombo(palette[dragging.palIdx]);
    palette[dragging.palIdx] = spawnItem();
    rebalancePalette();
    renderPalette();
  } else {
    releaseCombo(dragging.item);
  }
  voidEl.style.transition='transform 0.08s';
  voidEl.style.transform='scale(1.5)';
  setTimeout(()=>{ voidEl.style.transform=''; voidEl.style.transition='transform 0.4s'; },100);
}

/* ═══════════════════════════════════════════════════════════════
   CONTROLS
═══════════════════════════════════════════════════════════════ */
document.getElementById('playBtn').addEventListener('click',()=>{ if(!AC)return; if(playing)stopSeq(); else startSeq(); });
document.getElementById('bpmUp').addEventListener('click',()=>{ bpm=Math.min(200,bpm+5); document.getElementById('bpmVal').textContent=bpm; });
document.getElementById('shuffleBtn').addEventListener('click', () => {
  const btn = document.getElementById('shuffleBtn');
  btn.classList.add('flash');
  setTimeout(() => btn.classList.remove('flash'), 180);
  shufflePalette();
});

document.getElementById('stepsDn').addEventListener('click',()=>{ steps=Math.max(1,steps-1); document.getElementById('stepsVal').textContent=steps; renderSeq(); renderFX(); });

/* ═══════════════════════════════════════════════════════════════
   ENTRY — iOS audio unlock
═══════════════════════════════════════════════════════════════ */
function beginExperience(){
  const entry=document.getElementById('entry');
  if(entry.dataset.gone) return;
  entry.dataset.gone='1';
  initAudio();
  // On iOS, AudioContext starts suspended — must resume() inside user gesture
  if (AC.state === 'suspended') {
    AC.resume().catch(()=>{});
  }
  // Silent buffer to fully unlock iOS audio
  try {
    const buf=AC.createBuffer(1,1,AC.sampleRate);
    const s=AC.createBufferSource(); s.buffer=buf; s.connect(AC.destination); s.start(0);
  } catch(e){}
  entry.classList.add('leaving');
  document.getElementById('app').classList.add('visible');
  setTimeout(()=>{ entry.style.display='none'; },700);
}
document.getElementById('entry').addEventListener('touchend',beginExperience,{passive:false});
document.getElementById('entry').addEventListener('click',beginExperience);

/* boot */
initState();
renderAll();
