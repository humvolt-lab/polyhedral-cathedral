<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Polyhedral Cathedral Synth</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #fdfcf7;
  touch-action: none;
  font-family: monospace;
}

/* Top spawn area */
#spawnArea {
  position: absolute;
  top: 20px;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 18px;
}

/* Draggable shapes */
.shape {
  width: 80px;
  height: 80px;
  background: white;
  border: 3px solid black;
  border-radius: 12px;
  font-size: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: absolute;
  touch-action: none;
}

/* Drop zones */
#dropZones {
  position: absolute;
  bottom: 40px;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 28px;
}

.dropZone {
  width: 110px;
  height: 110px;
  border: 4px dashed black;
  border-radius: 16px;
}
</style>
</head>

<body>

<div id="spawnArea"></div>

<div id="dropZones">
  <div class="dropZone"></div>
  <div class="dropZone"></div>
  <div class="dropZone"></div>
</div>

<script>

/////////////////////////////////////////////////
// AUDIO (iOS-safe)
/////////////////////////////////////////////////

let AC;
let master;

function initAudio() {
  if (AC) return;

  AC = new (window.AudioContext || window.webkitAudioContext)();

  master = AC.createGain();
  master.gain.value = 0.45;
  master.connect(AC.destination);
}

document.body.addEventListener("touchstart", initAudio, { once: true });


/////////////////////////////////////////////////
// FUZZY ANALOG SYNTH
/////////////////////////////////////////////////

function playSynth(freq) {
  const o1 = AC.createOscillator();
  const o2 = AC.createOscillator();
  const g = AC.createGain();
  const f = AC.createBiquadFilter();

  o1.type = "sawtooth";
  o2.type = "square";

  o1.frequency.value = freq;
  o2.frequency.value = freq * 0.997;

  f.type = "lowpass";
  f.frequency.value = 1100;
  f.Q.value = 7;

  g.gain.setValueAtTime(0, AC.currentTime);
  g.gain.linearRampToValueAtTime(0.7, AC.currentTime + 0.05);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 1.4);

  o1.connect(f);
  o2.connect(f);
  f.connect(g);
  g.connect(master);

  o1.start();
  o2.start();
  o1.stop(AC.currentTime + 1.5);
  o2.stop(AC.currentTime + 1.5);
}


/////////////////////////////////////////////////
// SCALE
/////////////////////////////////////////////////

const SCALE = [0, 2, 3, 7, 10];

function randomFreq() {
  const base = 110;
  const octave = Math.floor(Math.random() * 3);
  const step = SCALE[Math.floor(Math.random() * SCALE.length)];
  return base * Math.pow(2, octave + step/12);
}


/////////////////////////////////////////////////
// TOUCH DRAG SYSTEM
/////////////////////////////////////////////////

const spawnArea = document.getElementById("spawnArea");
const zones = document.querySelectorAll(".dropZone");

function spawnShape(x, y) {

  const shape = document.createElement("div");
  shape.className = "shape";
  shape.textContent = "◼︎";
  shape.style.left = x + "px";
  shape.style.top = y + "px";

  shape.dataset.freq = randomFreq();

  let offsetX, offsetY;

  shape.addEventListener("touchstart", e => {
    const t = e.touches[0];
    offsetX = t.clientX - shape.offsetLeft;
    offsetY = t.clientY - shape.offsetTop;
  });

  shape.addEventListener("touchmove", e => {
    e.preventDefault();
    const t = e.touches[0];

    shape.style.left = (t.clientX - offsetX) + "px";
    shape.style.top = (t.clientY - offsetY) + "px";
  });

  shape.addEventListener("touchend", () => {

    const rect = shape.getBoundingClientRect();

    zones.forEach(zone => {
      const zr = zone.getBoundingClientRect();

      const hit =
        rect.left < zr.right &&
        rect.right > zr.left &&
        rect.top < zr.bottom &&
        rect.bottom > zr.top;

      if (hit && AC) {
        playSynth(Number(shape.dataset.freq));
      }
    });

    shape.remove();
    spawnRandom();
  });

  document.body.appendChild(shape);
}


function spawnRandom() {
  const x = window.innerWidth / 2 - 40 + (Math.random() * 120 - 60);
  const y = 40;
  spawnShape(x, y);
}


/////////////////////////////////////////////////
// INITIAL SPAWN
/////////////////////////////////////////////////

spawnRandom();
spawnRandom();
spawnRandom();

</script>
</body>
</html>
